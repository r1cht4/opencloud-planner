services:
  opencloud:
    image: ${OC_IMAGE:-opencloudeu/opencloud-rolling:latest}
    networks:
      - opencloud-net
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    entrypoint: /bin/sh
    command: ['-c', 'opencloud init || true && opencloud server']
    environment:
      OC_URL: https://host.docker.internal:9200
      OC_INSECURE: true
      OC_LOG_LEVEL: error
      IDM_ADMIN_PASSWORD: admin
      IDM_CREATE_DEMO_USERS: true
      PROXY_ENABLE_BASIC_AUTH: true
      PROXY_TLS: 'false'
      WEB_ASSET_APPS_PATH: /web/apps
    labels:
      traefik.enable: true
      traefik.constraint-label: opencloud-planner
      traefik.http.routers.opencloud.tls: true
      traefik.http.routers.opencloud.rule: Host(`host.docker.internal`) && PathPrefix(`/`)
      traefik.http.routers.opencloud.entrypoints: opencloud
      traefik.http.services.opencloud.loadbalancer.server.port: 9200
      traefik.http.routers.opencloud.middlewares: cors
    volumes:
      - opencloud-config:/etc/opencloud
      - ./dev/docker/opencloud/apps.yaml:/etc/opencloud/apps.yaml
      - ./dist:/web/apps/planner
    depends_on:
      - traefik
      - radicale

  radicale:
    image: ${RADICALE_DOCKER_IMAGE:-opencloudeu/radicale}:${RADICALE_DOCKER_TAG:-latest}
    user: ${OC_CONTAINER_UID_GID:-1000:1000}
    networks:
      - opencloud-net
    volumes:
      - radicale-data:/var/lib/radicale
      - ./dev/docker/radicale/config:/etc/radicale/config
    labels:
      traefik.enable: true
      traefik.constraint-label: opencloud-planner
      traefik.http.routers.radicale-caldav.tls: true
      traefik.http.routers.radicale-carddav.tls: true
      traefik.http.routers.radicale-caldav.rule: Host(`host.docker.internal`) && PathPrefix(`/caldav`)
      traefik.http.routers.radicale-caldav.priority: 100
      traefik.http.routers.radicale-caldav.entrypoints: opencloud
      traefik.http.routers.radicale-carddav.rule: Host(`host.docker.internal`) && PathPrefix(`/carddav`)
      traefik.http.routers.radicale-carddav.priority: 100
      traefik.http.routers.radicale-carddav.entrypoints: opencloud
      traefik.http.services.radicale.loadbalancer.server.port: 5232
      traefik.http.middlewares.radicale-caldav-scriptname.headers.customrequestheaders.X-Script-Name: /caldav
      traefik.http.middlewares.radicale-caldav-scriptname.headers.customrequestheaders.X-Remote-User: admin
      traefik.http.middlewares.radicale-carddav-scriptname.headers.customrequestheaders.X-Script-Name: /carddav
      traefik.http.middlewares.radicale-carddav-scriptname.headers.customrequestheaders.X-Remote-User: admin
      traefik.http.routers.radicale-caldav.middlewares: radicale-caldav-scriptname,cors
      traefik.http.routers.radicale-carddav.middlewares: radicale-carddav-scriptname,cors

  traefik:
    image: traefik:v3.6.1
    networks:
      opencloud-net:
        aliases:
          - host.docker.internal
    restart: unless-stopped
    entrypoint:
      [
        '/bin/sh',
        '-c',
        "[ -f /certificates/server.key ] && ./entrypoint.sh $$@ || (apk add openssl && openssl req -subj '/CN=opencloud.test' -x509 -sha256 -nodes -days 3650 -newkey rsa:2048 -keyout /certificates/server.key -out /certificates/server.crt && chmod -R 777 /certificates && ./entrypoint.sh $$@)"
      ]
    command:
      - '--pilot.dashboard=false'
      - '--log.level=DEBUG'
      - '--api.dashboard=true'
      - '--api.insecure=true'
      - '--providers.file.directory=/configs'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.constraints=Label(`traefik.constraint-label`, `opencloud-planner`)'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.opencloud.address=:9200'
      - '--entrypoints.opencloud-federated.address=:10200'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.http.middlewares=https_config@docker'
      - '--entrypoints.websecure.http.tls.options=default'
    labels:
      traefik.enable: true
      traefik.constraint-label: opencloud-planner
      traefik.http.routers.http_catchall.rule: HostRegexp(`{any:.+}`)
      traefik.http.routers.http_catchall.entrypoints: web
      traefik.http.routers.http_catchall.middlewares: https_config
      traefik.http.middlewares.https_config.headers.sslRedirect: true
      traefik.http.middlewares.https_config.headers.stsSeconds: 63072000
      traefik.http.middlewares.https_config.headers.stsIncludeSubdomains: true
      traefik.http.middlewares.cors.headers.accesscontrolallowmethods: '*'
      traefik.http.middlewares.cors.headers.accesscontrolallowheaders: '*'
      traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist: '*'
      traefik.http.middlewares.cors.headers.accesscontrolexposeheaders: '*'
      traefik.http.middlewares.cors.headers.accesscontrolmaxage: 100
      traefik.http.middlewares.cors.headers.addvaryheader: true
    ports:
      - '9200:9200'
    volumes:
      - './dev/docker/traefik/certificates:/certificates'
      - './dev/docker/traefik/configs:/configs'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'

volumes:
  opencloud-config:
  radicale-data:

networks:
  opencloud-net:
